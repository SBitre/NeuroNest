<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | NeuroNest</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get in Touch</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" cols="40" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Reach Us Directly</h2>
            <address>
                Email: <a href="mailto:hello@neuronest.app">hello@neuronest.app</a><br>
                Phone: <a href="tel:+15555555555">+1 (555) 555-5555</a><br>
                Location: Holyoke, Massachusetts, USA
            </address>
        </section>
    </main>

    <footer><p>&copy; 2026 NeuroNest</p></footer>
</body>
</html>
